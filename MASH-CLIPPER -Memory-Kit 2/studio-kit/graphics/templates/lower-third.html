<!doctype html>
<html lang="en" data-composition-variables='__VARS__'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <!--__HEAD__-->
    <style>
      #scene { position: absolute; inset: 0; }
      #lt {
        position: absolute;
        left: 6%;
        bottom: 12%;
        display: flex;
        align-items: stretch;
        gap: calc(var(--u) * 1.4);
      }
      .portrait #lt { bottom: 36%; left: 7%; } /* clears burned-in captions at ~70% height */
      .pos-right #lt { left: auto; right: 6%; flex-direction: row-reverse; }
      #bar {
        display: block;
        width: calc(var(--u) * 1);
        border-radius: calc(var(--u) * 0.5);
        background: var(--accent);
      }
      #card {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: calc(var(--u) * 0.6);
        padding: calc(var(--u) * 2) calc(var(--u) * 3.4) calc(var(--u) * 2.2);
        border-radius: calc(var(--u) * var(--radius) / 10.8);
        background: var(--bg);
        box-shadow: 0 calc(var(--u) * 0.6) calc(var(--u) * 2.4) rgba(0, 0, 0, 0.35);
      }
      #name {
        display: block;
        overflow: hidden;
        font-family: var(--fontDisplay);
        font-weight: var(--displayWeight);
        text-transform: var(--displayCase);
        font-size: calc(var(--u) * 4.6);
        line-height: 1.1;
        color: var(--text);
      }
      #name-in, #title-in { display: block; }
      #title {
        display: block;
        overflow: hidden;
        font-family: var(--fontBody);
        font-weight: 500;
        font-size: calc(var(--u) * 2.9);
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div id="root" class="__ORIENT__" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="__W__" data-height="__H__">
      <div id="scene" class="clip" data-start="0" data-duration="__DUR__" data-track-index="0">
        <div id="lt">
          <span id="bar"></span>
          <div id="card">
            <span id="name" data-layout-allow-overflow><span id="name-in">Name</span></span>
            <span id="title" data-layout-allow-overflow><span id="title-in">Title</span></span>
          </div>
        </div>
      </div>
    </div>
    <script>
      const v = Kit.vars();
      Kit.setup(v);
      const D = Kit.duration();
      Kit.text(document.getElementById("name-in"), v.name);
      Kit.text(document.getElementById("title-in"), v.title);
      if (!v.title) document.getElementById("title").style.display = "none";

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bar", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.35, ease: "power3.out" }, 0);
      tl.fromTo("#card", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power3.inOut" }, 0.15);
      tl.fromTo("#name-in", { yPercent: 110 }, { yPercent: 0, duration: 0.45, ease: "power3.out" }, 0.45);
      tl.fromTo("#title-in", { yPercent: 110 }, { yPercent: 0, duration: 0.45, ease: "power3.out" }, 0.55);
      tl.to("#card", { clipPath: "inset(0% 0% 0% 100%)", duration: 0.45, ease: "power3.inOut" }, D - 0.6);
      tl.to("#bar", { scaleY: 0, duration: 0.3, ease: "power3.in" }, D - 0.35);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
